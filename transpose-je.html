<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JE 谱移调工具</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f5f7;color:#1f2328;
       font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 48px;}
  h1{font-size:20px;margin:0 0 6px;}
  .sub{font-size:13px;color:#6b7280;margin:0 0 20px;}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;
        box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:780px){.panels{grid-template-columns:1fr}}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin:0 0 6px;}
  .row{display:flex;gap:8px;align-items:center;}
  input[type=text]{flex:1;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;
                   font:inherit;font-size:14px;background:#fff;}
  input[type=text]:focus,textarea:focus{outline:2px solid #93c5fd;outline-offset:1px;border-color:#93c5fd;}
  textarea{width:100%;min-height:240px;resize:vertical;padding:12px;border:1px solid #d1d5db;
           border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
           font-size:15px;line-height:1.7;background:#fff;}
  textarea[readonly]{background:#fafbfc;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  button{padding:8px 12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;
         font:inherit;font-size:13px;cursor:pointer;color:#374151;}
  button:hover{background:#f3f4f6;}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff;}
  button.primary:hover{background:#1d4ed8;}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;}
  .bar label{margin:0;}
  .info{font-size:12px;color:#6b7280;min-height:18px;margin:8px 0 0;}
  .err{font-size:13px;color:#b91c1c;min-height:18px;margin:8px 0 0;}
  .hint{font-size:12px;color:#6b7280;margin-top:18px;line-height:1.8;}
  code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>JE 谱移调工具</h1>
  <p class="sub">左边输入 JE 谱和移调指令，右边实时显示移调后的新 JE 谱。</p>

  <div class="panels">
    <!-- 左：输入 -->
    <div class="card">
      <div class="field">
        <label for="cmd">移调指令（格式：字母 =&gt; 字母）</label>
        <div class="row">
          <input id="cmd" type="text" value="C=>A" spellcheck="false" autocomplete="off">
          <button id="swap" title="把指令反过来">⇄</button>
        </div>
      </div>
      <div class="field">
        <div class="bar">
          <label for="je">JE 谱（原调）</label>
          <button id="demo">填入示例</button>
        </div>
        <textarea id="je" spellcheck="false" placeholder="例如：1 2 3 4 5 6 7 [1] (7) (6) 5 #4 b7"></textarea>
      </div>
      <p class="info" id="info"></p>
      <p class="err" id="err"></p>
    </div>

    <!-- 右：输出 -->
    <div class="card">
      <div class="field">
        <div class="bar">
          <label for="out">移调后的 JE 谱</label>
          <button id="copy" class="primary">复制</button>
        </div>
        <textarea id="out" readonly placeholder="结果会显示在这里"></textarea>
      </div>
      <p class="info" id="copyTip"></p>
    </div>
  </div>

  <p class="hint">
    规则：数字 <code>1</code>~<code>7</code> 为基本音级，<code>#</code> / <code>b</code> 为升降号，
    <code>( )</code> 降八度、<code>[ ]</code> 升八度，括号可嵌套。
    移调方向取最短音程（例如 <code>C=&gt;A</code> 按向下小三度处理）。
    JE 谱不含时值，移调只改变音高，不涉及节奏。
  </p>
</div>

<script>
/* ================= 核心：JE 谱移调 ================= */

// 调名 -> 半音值（C=0, C#=1, ...）
// const NOTE_TO_SEMITONE = {
//   'C': 0,  'C#': 1,  'DB': 1,
//   'D': 2,  'D#': 3,  'EB': 3,
//   'E': 4,  'FB': 4,  'E#': 5,
//   'F': 5,  'F#': 6,  'GB': 6,
//   'G': 7,  'G#': 8,  'AB': 8,
//   'A': 9,  'A#': 10, 'BB': 10,
//   'B': 11, 'CB': 11, 'B#': 0
// };

//口琴的调名与半音值
const NOTE_TO_SEMITONE = {
  'GB': -6,
  'G': -5,  'G#': -4,  'AB': -4,

  'A': -3,  'A#': -2, 'BB': -2,

  'B': -1, 'CB': -1, 'B#': 0,

  'C': 0,  

  'C#': 1,  'DB': 1,
  'D': 2,  'D#': 3,  'EB': 3,
  'E': 4,  'FB': 4,  'E#': 5,
  'F': 5,  'F#': 6,  
};


// 固定调中 1~7 对应的半音偏移（以 C 为 0）
const NATURAL_OFFSET = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11 };

// 半音 class -> [数字, 升降]（黑键优先用升号）
const PC_TO_NUM_ACC = [
  [1, 0],  // 0  C
  [1, 1],  // 1  #1
  [2, 0],  // 2  D
  [2, 1],  // 3  #2
  [3, 0],  // 4  E
  [4, 0],  // 5  F
  [4, 1],  // 6  #4
  [5, 0],  // 7  G
  [5, 1],  // 8  #5
  [6, 0],  // 9  A
  [6, 1],  // 10 #6
  [7, 0]   // 11 B
];

function noteToSemitone(note) {
  const key = String(note).trim().toUpperCase()
    .replace(/♯/g, '#')
    .replace(/♭/g, 'B');
  if (!(key in NOTE_TO_SEMITONE)) throw new Error('未知调名：' + note);
  return NOTE_TO_SEMITONE[key];
}

// 解析指令，返回移调信息（diff 默认取最短音程）
function parseCommand(command) {
  const m = String(command).match(
    /^\s*([A-Ga-g][#b♯♭]?)\s*(?:=>|->|→)\s*([A-Ga-g][#b♯♭]?)\s*$/
  );
  if (!m) throw new Error('指令格式应为 字母=>字母，例如 C=>A');

  const sourceRoot = noteToSemitone(m[1]);
  const targetRoot = noteToSemitone(m[2]);

  // let diff = targetRoot - sourceRoot;
  let diff = sourceRoot - targetRoot;//要变化的半音值
  while (diff > 6) diff -= 12;
  while (diff < -6) diff += 12;

  return { source: m[1], target: m[2], sourceRoot, targetRoot, diff };
}

/**
 * JE 谱移调
 * @param {string} je       JE 谱字符串，例如 "1 2 3 (4) [5]"
 * @param {string} command  移调指令，例如 "C=>A"
 * @returns {string}        移调后的 JE 谱
 */
function transposeJE(je, command) {
  const { diff } = parseCommand(command);

  let octave = 0;   // 当前括号带来的八度偏移
  let result = '';
  let i = 0;

  while (i < je.length) {
    const ch = je[i];

    // 处理音区括号：小括号降八度，方括号升八度
    if (ch === '(') { octave--; i++; continue; }
    if (ch === ')') { octave++; i++; continue; }
    if (ch === '[') { octave++; i++; continue; }
    if (ch === ']') { octave--; i++; continue; }

    // 尝试解析一个音符：# / b + 1~7
    let acc = 0;
    let j = i;
    if (je[j] === '#') { acc = 1; j++; }
    else if (je[j] === 'b') { acc = -1; j++; }

    if (je[j] >= '1' && je[j] <= '7') {
      const num = parseInt(je[j], 10);

      // 原固定调半音值（1 对应 C）
      const semi = NATURAL_OFFSET[num] + acc + octave * 12;
      // 移调后的半音值
      const newSemi = semi + diff;

      const pc = ((newSemi % 12) + 12) % 12;
      const targetOctave = Math.floor(newSemi / 12);
      const [targetNum, targetAcc] = PC_TO_NUM_ACC[pc];

      const accStr = targetAcc === 1 ? '#' : targetAcc === -1 ? 'b' : '';

      // 根据目标八度生成括号
      let left = '', right = '';
      if (targetOctave < 0) {
        left = '('.repeat(-targetOctave);
        right = ')'.repeat(-targetOctave);
      } else if (targetOctave > 0) {
        left = '['.repeat(targetOctave);
        right = ']'.repeat(targetOctave);
      }

      result += left + accStr + targetNum + right;
      i = j + 1;
    } else {
      // 非音符字符原样保留（空格、逗号等）
      result += ch;
      i++;
    }
  }

  return result;
}

/* ================= 页面交互 ================= */

const INTERVAL_NAMES = {
  0: '同度', 1: '小二度', 2: '大二度', 3: '小三度',
  4: '大三度', 5: '纯四度', 6: '三全音'
};

const els = {
  cmd:     document.getElementById('cmd'),
  je:      document.getElementById('je'),
  out:     document.getElementById('out'),
  info:    document.getElementById('info'),
  err:     document.getElementById('err'),
  copy:    document.getElementById('copy'),
  copyTip: document.getElementById('copyTip'),
  swap:    document.getElementById('swap'),
  demo:    document.getElementById('demo')
};

function describe(info) {
  const d = info.diff;
  if (d === 0) return `${info.source} → ${info.target}：无需移调`;
  const dir = d > 0 ? '向上' : '向下';
  const n = Math.abs(d);
  return `${info.source} → ${info.target}：${dir} ${n} 个半音（${INTERVAL_NAMES[n] || n + ' 个半音'}）`;
}

function update() {
  els.err.textContent = '';
  els.info.textContent = '';
  els.copyTip.textContent = '';

  const je = els.je.value;
  const cmd = els.cmd.value;

  if (!je.trim()) {
    els.out.value = '';
    return;
  }

  try {
    els.out.value = transposeJE(je, cmd);
    els.info.textContent = describe(parseCommand(cmd));
  } catch (e) {
    els.out.value = '';
    els.err.textContent = e.message;
  }
}

// 输入即刷新
els.je.addEventListener('input', update);
els.cmd.addEventListener('input', update);

// 回车刷新
els.cmd.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { update(); els.cmd.blur(); }
});

// 反转指令
els.swap.addEventListener('click', () => {
  const m = els.cmd.value.match(
    /^\s*([A-Ga-g][#b♯♭]?)\s*(?:=>|->|→)\s*([A-Ga-g][#b♯♭]?)\s*$/
  );
  if (m) {
    els.cmd.value = `${m[2]}=>${m[1]}`;
    update();
  }
});

// 填入示例
els.demo.addEventListener('click', () => {
  els.je.value = '1 2 3 4 5 6 7 [1] (7) (6) 5 #4 b7 (5[7])';
  update();
  els.je.focus();
});

// 复制结果
els.copy.addEventListener('click', async () => {
  const text = els.out.value;
  if (!text) {
    els.copyTip.textContent = '没有可复制的内容';
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // 兼容旧浏览器
    els.out.removeAttribute('readonly');
    els.out.select();
    document.execCommand('copy');
    els.out.setAttribute('readonly', 'readonly');
  }
  els.copyTip.textContent = '已复制到剪贴板 ✓';
  setTimeout(() => { els.copyTip.textContent = ''; }, 2000);
});

// 初始化
update();
</script>
</body>
</html>
